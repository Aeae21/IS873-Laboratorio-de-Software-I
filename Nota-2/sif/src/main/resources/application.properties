spring.application.name=sif

# ---------- PostgreSQL database ----------
# On the computer it uses the local PostgreSQL (user postgres).
# On Render we create the variables DB_URL, DB_USER and DB_PASSWORD with the Clever Cloud data.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sif}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
# The free plan of Clever Cloud allows only a few connections
spring.datasource.hikari.maximum-pool-size=3

# When it starts, it creates the tables (schema.sql) and loads the test data (data.sql)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ---------- Server ----------
# Render sends the port in the PORT variable; on the computer it is 8080
server.port=${PORT:8080}
# RNF-02: the session closes after 60 minutes without activity
server.servlet.session.timeout=60m

