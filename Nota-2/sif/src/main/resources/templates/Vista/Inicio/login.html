<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{Vista/Inicio/plantilla :: cabecera}"></head>
    <body>
        <!-- Mockup from Nota 1: Login (CU-01) -->
        <div style="width: 420px; margin: 60px auto; border: 2px solid #000; padding: 10px 14px;">
            <b>SIF - ACME Corporation</b><br>
            <b>Iniciar sesión</b>
            <!-- Messages of CU-01. Spring Security sends the name of the message in the address. -->
            <div class="error" th:if="${param.vacioUsuario}">Debe diligenciar el campo Nombre de usuario.</div>
            <div class="error" th:if="${param.vacioContrasena}">Debe diligenciar el campo Contraseña.</div>
            <div class="error" th:if="${param.error}">Usuario o contraseña incorrectos.</div>
            <div class="error" th:if="${param.inactivo}">El usuario está inactivo. Comuníquese con el administrador.</div>
            <div class="error" th:if="${param.expirado}">La sesión se cerró por inactividad. Ingrese nuevamente.</div>

            <!-- th:action adds the security code (CSRF) that Spring Security asks for -->
            <form th:action="@{/login}" method="post">
                <label>Nombre de usuario</label><input type="text" name="nombreUsuario"><br>
                <label>Contraseña</label><input type="password" name="contrasena"><br>
                <label></label><button class="boton" style="width: 200px">Ingresar</button>
            </form>
        </div>
    </body>
</html>
